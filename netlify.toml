# Netlify + Next.js (@netlify/plugin-nextjs / OpenNext)
#
# Publish MUST be `.next` — the plugin looks for Next build output there.
# Do NOT set publish to `public` (plugin fails) or leave a multi-GB `.next`
# with cache/standalone (Lambda 250 MB limit).
#
# After first setup: Site UI → Build settings → clear conflicting publish if
# needed, then "Clear cache and deploy site" once.

[build]
  # Drop Turbopack/webpack cache before the plugin packages the handler.
  command = "pnpm run build && rm -rf .next/cache .next/dev"
  publish = ".next"

[build.environment]
  # Next.js inlines server env into SSR chunks at build time (not client JS).
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/**"
  # Database name is not a credential; collides with repo folder name in docs.
  SECRETS_SCAN_OMIT_KEYS = "MONGO_DB_NAME"

[[plugins]]
  package = "@netlify/plugin-nextjs"
